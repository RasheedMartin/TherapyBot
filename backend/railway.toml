# Railway config-as-code for the web service (set the service's config path to /backend/railway.toml)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health/"
# First boot builds the retrieval index, so allow extra time
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
