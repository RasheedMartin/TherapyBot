[tool.poetry]
name = "therapybot"
version = "0.1.0"
description = "AI-powered therapy bot with Django backend and LlamaIndex RAG"
authors = ["Rasheed Martin <rasheedjmartin@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <4.0"

# Django
django = "^4.2.0"
djangorestframework = "^3.14.0"
django-cors-headers = "^4.3.0"

# LlamaIndex and AI
llama-index = "^0.10.0"
llama-index-core = "^0.13.0"
llama-index-llms-groq = "^0.4.1"
llama-index-embeddings-huggingface = "^0.2.0"
llama-index-readers-web = "^0.1.0"

# OpenAI and ML
sentence-transformers = "^2.5.0"
transformers = "^4.38.0"

# Utilities
requests = "^2.31.0"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "therapybot.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]